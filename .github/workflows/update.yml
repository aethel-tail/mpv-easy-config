name: update

# Fetches the mpv manual, rebuilds the option data, translates whatever is missing
# inside the runner (no API keys anywhere), commits the result and deploys Pages.

on:
  schedule:
    - cron: "0 3 * * *"
  # Changing the update pipeline should exercise it once. Data commits use the
  # built-in token, which does not re-trigger workflows, so this cannot loop.
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      limit:
        description: "每个分片每种语言最多翻译多少条（0 = 不限）"
        default: "0"
      shards:
        description: "分片数（0 = 用仓库变量 SHARDS，缺省 8）"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  LLAMA_TAG: b12600
  # apt's mpv is far behind the manual; this AppImage tracks a recent release.
  MPV_APPIMAGE: https://github.com/pkgforge-dev/mpv-AppImage/releases/download/v0.42.0%402026-11-07_1794059289/mpv-v0.42.0-anylinux-x86_64.AppImage
  # Override with a repository variable; nothing here is a secret.
  MODEL_URL: ${{ vars.TRANSLATE_MODEL_URL || 'https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      pending: ${{ steps.plan.outputs.pending }}
      shards: ${{ steps.plan.outputs.shards }}
      shardList: ${{ steps.plan.outputs.shardList }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Fetch the manual revision
        run: node scripts/fetch-manual.mjs

      # apt's mpv on the runners lags the manual by several releases, which drops
      # metadata coverage below the gate. The AppImage is unpacked and used directly.
      - name: Fetch mpv
        run: |
          curl -sSL -o /tmp/mpv.AppImage "$MPV_APPIMAGE"
          chmod +x /tmp/mpv.AppImage
          cd /tmp && ./mpv.AppImage --appimage-extract > /dev/null
          /tmp/squashfs-root/AppRun --version | head -1

      - name: Rebuild the option data
        env:
          MPV_BIN: /tmp/squashfs-root/AppRun
        run: |
          node scripts/list-options.mjs
          node scripts/build-data.mjs --out .cache/new/options.json

      - name: Decide what needs doing
        id: plan
        run: node scripts/plan.mjs
        env:
          SHARDS_INPUT: ${{ inputs.shards }}
          SHARDS_VAR: ${{ vars.SHARDS }}

      - name: Verify the data
        run: node scripts/report.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: data
          path: site/data/options.json
          retention-days: 3

  translate:
    needs: plan
    if: needs.plan.outputs.pending != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shardList) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: data
          path: site/data

      - name: Skip an idle shard before paying for the model download
        id: check
        run: |
          counted=$(node scripts/translate.mjs --lang zh --shard ${{ matrix.shard }} --shards ${{ needs.plan.outputs.shards }} --dry-run)
          echo "pending=$(printf '%s' "$counted" | grep -oE '^[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Fetch llama.cpp
        if: steps.check.outputs.pending != '0'
        run: |
          mkdir -p /tmp/llama
          curl -sSL -o /tmp/llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          find /tmp/llama -name llama-server -type f -exec chmod +x {} \;

      - name: Cache the model
        if: steps.check.outputs.pending != '0'
        id: model
        uses: actions/cache@v6
        with:
          path: /tmp/model.gguf
          key: model-${{ hashFiles('.github/workflows/update.yml') }}

      - name: Download the model
        if: steps.check.outputs.pending != '0' && steps.model.outputs.cache-hit != 'true'
        run: curl -sSL -o /tmp/model.gguf "$MODEL_URL"

      - name: Start llama-server
        if: steps.check.outputs.pending != '0'
        run: |
          SERVER=$(find /tmp/llama -name llama-server -type f | head -1)
          "$SERVER" -m /tmp/model.gguf --port 8099 -c 4096 -t 4 --no-warmup > /tmp/server.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8099/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "llama-server did not become healthy"
          tail -20 /tmp/server.log
          exit 1

      - name: Translate
        if: steps.check.outputs.pending != '0'
        run: |
          for lang in zh ja; do
            node scripts/translate.mjs --lang "$lang" \
              --shard ${{ matrix.shard }} --shards ${{ needs.plan.outputs.shards }} \
              --limit ${{ inputs.limit || 0 }} --budget 2200 \
              --base-url http://127.0.0.1:8099 --model local
          done

      - uses: actions/upload-artifact@v7
        if: always() && steps.check.outputs.pending != '0'
        with:
          name: trans-${{ matrix.shard }}
          path: |
            site/data/trans.*.json
            site/data/trans.*.report.json
          retention-days: 3
          if-no-files-found: ignore

  publish:
    needs: [plan, translate]
    if: |
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.changed == 'true' || needs.plan.outputs.pending != '0')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: data
          path: site/data

      - uses: actions/download-artifact@v8
        with:
          pattern: trans-*
          path: parts

      - name: Merge translations
        run: node scripts/merge-trans.mjs parts site/data

      - name: Rebuild the page
        run: npm run build

      # Data quality gates always run. Translation coverage is deliberately not gated
      # here: a partly translated site still deploys and finishes on the next run.
      - name: Verify the data
        run: node scripts/report.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: sync mpv@$(node -p "require('./site/data/options.json').mpvCommit.slice(0,7)")"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
